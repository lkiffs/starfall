<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Звёздопад</title>
<style>
:root{
  --sky:#dbe7ff;--ink:#14183a;--me:#1f6f8b;--panel:rgba(235,242,255,.9);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--sky:#0e1330;--ink:#eef0ff;--me:#7bdff2;--panel:rgba(10,14,40,.9)}
}
:root[data-theme="dark"]{--sky:#0e1330;--ink:#eef0ff;--me:#7bdff2;--panel:rgba(10,14,40,.9)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--sky);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:relative;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;
  font-size:28px;font-weight:700;pointer-events:none;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
#lv{color:#ff6b6b;letter-spacing:4px}
#ov{position:absolute;inset:0;display:flex;padding:20px;background:var(--panel);overflow-y:auto;touch-action:pan-y}
.scr{margin:auto;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
h1{margin:0;font-size:40px}
h2{margin:8px 0 0;font-size:18px;align-self:flex-start}
p{margin:0;line-height:1.45;font-size:17px}
.bank{font-size:26px;font-weight:700;color:#e0a100}
button{min-height:52px;padding:0 32px;border:2px solid transparent;border-radius:26px;background:var(--me);color:var(--sky);
  font:700 20px "Trebuchet MS",system-ui,sans-serif;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border-color:var(--me)}
button.sm{min-height:44px;padding:0 18px;font-size:16px}
button[aria-pressed="false"]{background:transparent;color:var(--ink);border-color:var(--me)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.row2{display:flex;gap:10px;width:100%}.row2 button{flex:1;padding:0 10px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.item span{flex:1;font-size:17px}
.item i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:18px}
.rec{list-style:none;margin:0;padding:0;width:100%}
.rec li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:7px 10px;border-radius:10px;text-align:left}
.rec li.cur{background:rgba(127,127,127,.22)}
.rec em{font-style:normal;opacity:.7;font-size:14px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div class="hud"><span id="sc">0</span><span id="lv"></span></div>
  <div id="ov"><div id="scr" class="scr"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0;
function fit(){
  const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);
  W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
}
addEventListener('resize',fit);

/* Данные */
const D={bank:0,owned:['cyan','purple'],hand:'cyan',theme:'purple',runs:[],
  set:{snd:1,mus:1,vib:1,lang:(navigator.language||'ru').slice(0,2)==='ru'?'ru':'en'}};
try{
  const j=JSON.parse(localStorage.getItem('starfall-v2')||'null');
  if(j){const s=Object.assign({},D.set,j.set);Object.assign(D,j);D.set=s}
}catch(e){}
function save(){try{localStorage.setItem('starfall-v2',JSON.stringify(D))}catch(e){}}
const has=id=>D.owned.includes(id);

/* Тексты */
const L={
ru:{title:'Звёздопад',hint:'Води пальцем по экрану, лови звёзды и обходи камни.',play:'Играть',again:'Играть снова',
 shop:'Магазин',set:'Настройки',back:'Назад',recs:'Рекорды',none:'Здесь появятся твои заходы',
 snd:'Звуки',mus:'Музыка',vib:'Вибрация',lang:'Язык',on:'Вкл',off:'Выкл',
 hands:'Цвет руки',gals:'Галактика',boost:'Улучшения',eq:'Выбрать',cur:'Надето',own:'Куплено',
 over:'Игра окончена',got:'Звёзд собрано: ',best:' Новый рекорд!'},
en:{title:'Starfall',hint:'Drag your finger to catch stars and dodge the rocks.',play:'Play',again:'Play again',
 shop:'Shop',set:'Settings',back:'Back',recs:'Records',none:'Your runs will appear here',
 snd:'Sounds',mus:'Music',vib:'Vibration',lang:'Language',on:'On',off:'Off',
 hands:'Hand color',gals:'Galaxy',boost:'Boosts',eq:'Equip',cur:'Equipped',own:'Owned',
 over:'Game over',got:'Stars collected: ',best:' New record!'}};
const T=k=>L[D.set.lang][k];

/* Магазин */
const SK={cyan:{c:'#c4f6ff',rgb:'160,240,255'},red:{c:'#ff5a5a',rgb:'255,90,90'},green:{c:'#6dff9c',rgb:'109,255,156'},
  pink:{c:'#ff8ad8',rgb:'255,138,216'},gold:{c:'#ffd45e',rgb:'255,212,94'}};
const TH={purple:{h:[205,100],mid:'190,120,255',out:'60,90,255'},sunset:{h:[0,55],mid:'255,110,80',out:'255,60,120'},
  aurora:{h:[130,80],mid:'80,255,170',out:'0,160,255'}};
const SHOP=[
 {id:'cyan',k:'hand',p:0,n:['Голубая рука','Cyan hand']},
 {id:'red',k:'hand',p:200,n:['Красная рука','Red hand']},
 {id:'green',k:'hand',p:250,n:['Зелёная рука','Green hand']},
 {id:'pink',k:'hand',p:300,n:['Розовая рука','Pink hand']},
 {id:'gold',k:'hand',p:400,n:['Золотая рука','Golden hand']},
 {id:'purple',k:'sky',p:0,n:['Пурпурная туманность','Purple nebula']},
 {id:'sunset',k:'sky',p:300,n:['Галактика «Закат»','Sunset galaxy']},
 {id:'aurora',k:'sky',p:350,n:['Галактика «Аврора»','Aurora galaxy']},
 {id:'magnet',k:'perk',e:'🧲',p:400,n:['Магнит для звёзд','Star magnet']},
 {id:'life',k:'perk',e:'❤',p:500,n:['Запасная жизнь','Spare life']},
 {id:'trail',k:'perk',e:'✨',p:350,n:['Шлейф искр','Sparkle trail']}];
const nm=it=>it.n[D.set.lang==='ru'?0:1];
function row(it){
  const own=has(it.id);
  const sw=it.k==='hand'?'<i style="background:'+SK[it.id].c+'"></i>':
    it.k==='sky'?'<i style="background:rgb('+TH[it.id].mid+')"></i>':'<i>'+it.e+'</i>';
  let b;
  if(!own)b='<button class="sm" data-a="buy" data-id="'+it.id+'"'+(D.bank<it.p?' disabled':'')+'>'+it.p+' ★</button>';
  else if(it.k==='perk')b='<button class="sm" disabled>'+T('own')+'</button>';
  else{const on=(it.k==='hand'?D.hand:D.theme)===it.id;
    b='<button class="sm" data-a="eq" data-id="'+it.id+'"'+(on?' disabled':'')+'>'+T(on?'cur':'eq')+'</button>'}
  return '<div class="item">'+sw+'<span>'+nm(it)+'</span>'+b+'</div>';
}
function buy(id){
  const it=SHOP.find(x=>x.id===id);
  if(!it||has(id)||D.bank<it.p)return;
  D.bank-=it.p;D.owned.push(id);equip(it);save();chime();screen('shop');
}
function equip(it){
  if(it.k==='hand')D.hand=it.id;
  if(it.k==='sky'){D.theme=it.id;makeGalaxy()}
}

/* Экраны */
let cur='menu',res=null,lastT=0;
const fmt=t=>{const d=new Date(t),l=D.set.lang;
  return d.toLocaleDateString(l,{day:'numeric',month:'short'})+', '+d.toLocaleTimeString(l,{hour:'2-digit',minute:'2-digit'})};
const tog=k=>'<div class="item"><span>'+T(k)+'</span><button class="sm" data-a="tog" data-k="'+k+'" aria-pressed="'+!!D.set[k]+'">'+T(D.set[k]?'on':'off')+'</button></div>';
const lg=(v,n)=>'<button class="sm" data-a="lang" data-v="'+v+'" aria-pressed="'+(D.set.lang===v)+'">'+n+'</button>';
const VIEWS={
 menu(){
  const top=[...D.runs].sort((a,b)=>b.s-a.s||b.t-a.t).slice(0,5);
  const li=top.map((r,i)=>'<li'+(r.t===lastT?' class="cur"':'')+'><b>'+(i+1)+'</b><span>★ '+r.s+'</span><em>'+fmt(r.t)+'</em></li>').join('');
  return '<h1>'+T(res?'over':'title')+'</h1><p>'+(res?T('got')+res.s+(res.b?T('best'):''):T('hint'))+'</p>'+
   '<div class="bank">★ '+D.bank+'</div><button data-a="play">'+T(res?'again':'play')+'</button>'+
   '<div class="row2"><button class="alt" data-a="shop">'+T('shop')+'</button><button class="alt" data-a="set">'+T('set')+'</button></div>'+
   '<h2>'+T('recs')+'</h2>'+(li?'<ol class="rec">'+li+'</ol>':'<p>'+T('none')+'</p>');
 },
 shop(){
  const sec=(k,h)=>'<h2>'+T(h)+'</h2>'+SHOP.filter(i=>i.k===k).map(row).join('');
  return '<h1>'+T('shop')+'</h1><div class="bank">★ '+D.bank+'</div>'+sec('hand','hands')+sec('sky','gals')+sec('perk','boost')+
   '<button class="alt" data-a="menu">'+T('back')+'</button>';
 },
 set(){
  return '<h1>'+T('set')+'</h1>'+tog('snd')+tog('mus')+tog('vib')+
   '<div class="item"><span>'+T('lang')+'</span>'+lg('ru','RU')+lg('en','EN')+'</div>'+
   '<button class="alt" data-a="menu">'+T('back')+'</button>';
 }};
function screen(n){
  cur=n;document.documentElement.lang=D.set.lang;document.title=T('title');
  $('ov').classList.remove('hide');$('scr').innerHTML=VIEWS[n]();$('ov').scrollTop=0;
}
$('scr').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  audio();musicStart();
  const a=b.dataset.a;
  if(a==='play')start();
  else if(a==='shop'||a==='set'||a==='menu')screen(a);
  else if(a==='buy')buy(b.dataset.id);
  else if(a==='eq'){equip(SHOP.find(x=>x.id===b.dataset.id));save();screen('shop')}
  else if(a==='tog'){const k=b.dataset.k;D.set[k]=D.set[k]?0:1;if(k==='mus')D.set.mus?musicStart():musicStop();save();screen('set')}
  else if(a==='lang'){D.set.lang=b.dataset.v;save();screen('set')}
});

/* Звук и музыка */
let AC=null,mGain=null,mDelay=null,mTimer=null,step=0;
function audio(){
  try{
    if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(A)AC=new A()}
    if(AC&&AC.state==='suspended')AC.resume();
  }catch(e){}
}
function note(f,t,dur,type,vol,att,dest){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.1);
}
function tone(f1,f2,dur,type,vol){
  if(!AC||!D.set.snd)return;
  try{
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur);
  }catch(e){}
}
const chime=()=>{tone(880,1320,.18,'sine',.25);tone(1320,1760,.24,'triangle',.12)};
const thud=()=>tone(180,60,.25,'sawtooth',.2);
const buzz=n=>{if(D.set.vib&&navigator.vibrate)navigator.vibrate(n)};
const CH=[[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66],[164.81,207.65,246.94]];
const PEN=[523.25,587.33,659.25,783.99,880,1046.5];
function musicTick(){
  if(!AC||!D.set.mus||document.hidden||!mGain)return;
  try{
    const t=AC.currentTime,c=CH[step++%4];
    c.forEach(f=>note(f,t,9,'sine',.12,3,mGain));
    note(c[0]/2,t,9,'sine',.18,3,mGain);
    for(let i=0;i<3;i++){
      const f=PEN[Math.floor(Math.random()*PEN.length)],d=1+Math.random()*4.5;
      note(f,t+d,2.5,'triangle',.08,.02,mGain);note(f,t+d,2.5,'triangle',.05,.02,mDelay);
    }
  }catch(e){}
}
function musicStart(){
  if(!AC||mTimer||!D.set.mus)return;
  try{
    mGain=AC.createGain();mGain.gain.value=.35;mGain.connect(AC.destination);
    mDelay=AC.createDelay(2);mDelay.delayTime.value=.5;
    const fb=AC.createGain();fb.gain.value=.4;mDelay.connect(fb);fb.connect(mDelay);mDelay.connect(mGain);
    musicTick();mTimer=setInterval(musicTick,6000);
  }catch(e){}
}
function musicStop(){
  clearInterval(mTimer);mTimer=null;
  if(mGain){const g=mGain;g.gain.setTargetAtTime(0,AC.currentTime,.3);setTimeout(()=>g.disconnect(),1500);mGain=null}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)save();
  if(AC){document.hidden?AC.suspend():AC.resume()}
});

/* Галактика */
let gal=[],far=[];
function makeGalaxy(){
  const th=TH[D.theme]||TH.purple;gal=[];far=[];
  for(let i=0;i<460;i++){
    const r=Math.pow(Math.random(),.75),a=(i%3)*2.094+r*6+(Math.random()-.5)*(.9-r*.5);
    const hue=r<.25?40:th.h[0]+Math.random()*th.h[1];
    gal.push({r,a,s:Math.random()*1.7+.5,tw:Math.random()*6,c:'hsl('+hue+',85%,'+(70+Math.random()*20)+'%)'});
  }
  for(let i=0;i<60;i++)far.push({x:Math.random(),y:Math.random(),s:Math.random()*1.4+.4,tw:Math.random()*6});
}
function drawGalaxy(t){
  const th=TH[D.theme]||TH.purple;
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  ctx.fillStyle='#060818';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  for(const d of far){ctx.globalAlpha=.2+.5*Math.abs(Math.sin(t*1.3+d.tw));ctx.fillRect(d.x*W,d.y*H,d.s,d.s)}
  const R=Math.max(W,H)*.5;
  ctx.save();ctx.translate(W/2,H*.36);ctx.rotate(-.35);
  ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(0,0,0,0,0,R*.9);
  g.addColorStop(0,'rgba(255,220,160,.55)');g.addColorStop(.18,'rgba('+th.mid+',.22)');
  g.addColorStop(.55,'rgba('+th.out+',.10)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.save();ctx.scale(1,.55);ctx.globalAlpha=1;ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,R*.9,0,7);ctx.fill();ctx.restore();
  for(const p of gal){
    const a=p.a+t*.05*(1.2-p.r*.8);
    ctx.globalAlpha=.35+.5*Math.abs(Math.sin(t*1.6+p.tw));
    ctx.fillStyle=p.c;ctx.fillRect(Math.cos(a)*p.r*R,Math.sin(a)*p.r*R*.55,p.s,p.s);
  }
  ctx.restore();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}

/* Рука */
function drawHand(x,y){
  const sk=SK[D.hand]||SK.cyan;
  ctx.save();ctx.translate(x,y+10);
  const g=ctx.createRadialGradient(0,-4,4,0,-4,70);
  g.addColorStop(0,'rgba('+sk.rgb+',.45)');g.addColorStop(1,'rgba('+sk.rgb+',0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,-4,70,0,7);ctx.fill();
  ctx.shadowColor=sk.c;ctx.shadowBlur=22;
  ctx.strokeStyle=sk.c;ctx.fillStyle=sk.c;ctx.lineCap='round';ctx.lineWidth=9;
  for(const f of [[-21,6,-25,-14],[-7,4,-8,-26],[7,4,8,-24],[21,6,25,-10]]){
    ctx.beginPath();ctx.moveTo(f[0],f[1]);ctx.lineTo(f[2],f[3]);ctx.stroke();
  }
  ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(-24,22);ctx.lineTo(-42,4);ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,20,28,20,0,0,7);ctx.fill();
  ctx.restore();
}

/* Игра */
let state='ready',score=0,lives=3,px=0,tx=0,items=[],parts=[],spawn=0,last=0;
const PW=70,R=15;
function hud(){$('sc').textContent=score;$('lv').textContent='♥'.repeat(Math.max(lives,0))}
function start(){
  fit();res=null;score=0;lives=3+(has('life')?1:0);items=[];parts=[];spawn=0;
  px=tx=W/2;state='play';last=performance.now();
  $('ov').classList.add('hide');hud();
}
function over(){
  state='over';
  const prev=D.runs.reduce((m,r)=>Math.max(m,r.s),0);
  lastT=Date.now();D.runs.push({s:score,t:lastT});if(D.runs.length>300)D.runs.shift();
  D.bank+=score;save();
  res={s:score,b:score>prev&&score>0};
  screen('menu');
}
function aim(e){tx=Math.max(PW/2,Math.min(W-PW/2,e.clientX-cv.getBoundingClientRect().left))}
cv.addEventListener('pointerdown',aim);
cv.addEventListener('pointermove',aim);
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')tx=Math.max(PW/2,tx-50);
  if(e.key==='ArrowRight')tx=Math.min(W-PW/2,tx+50);
});
function star(x,y,r,rot){
  ctx.beginPath();
  for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}
  ctx.closePath();ctx.fill();
}
function rock(x,y,r,rot){
  ctx.beginPath();
  for(let i=0;i<7;i++){const a=rot+i*2*Math.PI/7,rr=r*(i%2?.8:1.05);ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}
  ctx.closePath();ctx.fill();
}
function burst(x,y){
  for(let i=0;i<8;i++){const a=Math.random()*6.28,v=60+Math.random()*90;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.6,c:'#ffd166'})}
}
function loop(now){
  requestAnimationFrame(loop);
  const t=now/1000;
  if(state!=='play'){drawGalaxy(t);return}
  const dt=Math.min((now-last)/1000,.05);last=now;
  const py=H-90,mag=has('magnet');
  px+=(tx-px)*Math.min(1,dt*16);
  spawn-=dt;
  if(spawn<=0){
    spawn=Math.max(.28,.85-score*.012);
    const bad=Math.random()<Math.min(.35,.16+score*.004);
    items.push({x:R+Math.random()*(W-2*R),y:-R,bad,rot:Math.random()*6,
      v:Math.min(H*.9,H*.3+score*5)*(.85+Math.random()*.3)});
  }
  drawGalaxy(t);
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];it.y+=it.v*dt;it.rot+=dt*(it.bad?2:1);
    if(mag&&!it.bad&&it.y>py-240)it.x+=(px-it.x)*Math.min(1,dt*2.5);
    const hit=it.y+R>py&&it.y-R<py+22&&Math.abs(it.x-px)<PW/2+R*.4;
    if(hit){
      items.splice(i,1);
      if(it.bad){lives--;thud();buzz(40)}else{score++;chime();burst(it.x,it.y)}
      hud();
      if(lives<=0){over();return}
      continue;
    }
    if(it.y>H+R){items.splice(i,1);continue}
    ctx.fillStyle=it.bad?'#ff6b6b':'#ffd166';
    it.bad?rock(it.x,it.y,R,it.rot):star(it.x,it.y,R,it.rot);
  }
  if(has('trail')&&Math.random()<.6)
    parts.push({x:px+(Math.random()-.5)*50,y:py+10+Math.random()*20,vx:(Math.random()-.5)*20,vy:-40-Math.random()*40,l:.8,c:(SK[D.hand]||SK.cyan).c});
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.l-=dt;
    if(p.l<=0){parts.splice(i,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.globalAlpha=Math.min(1,p.l*1.6);ctx.fillStyle=p.c;ctx.fillRect(p.x-1.5,p.y-1.5,3,3);
  }
  ctx.globalAlpha=1;
  drawHand(px,py);
}
fit();makeGalaxy();screen('menu');requestAnimationFrame(loop);
</script>
</body>
</html>
